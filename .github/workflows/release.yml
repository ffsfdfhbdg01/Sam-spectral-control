name: Release

# Installers for macOS (universal .pkg) and Windows (x64 Inno Setup), signed and notarised when the
# signing secrets exist and unsigned otherwise (REL-1…REL-3, docs/release.md). A version tag
# (vX.Y.Z) also drafts a GitHub release; it is refused while the licence or the identifiers are
# undecided (ADR-0002, ADR-0016).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  PLUGINVAL_VERSION: v1.0.4
  VST3_SDK_TAG: v3.8.1_build_84
  ARTEFACTS: build/src/SamSpectralControl_artefacts/Release

jobs:
  check:
    name: Version and release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          version="$(sed -n 's/^project(SamSpectralControl VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"
      - name: Release gate
        if: github.ref_type == 'tag'
        run: |
          version="${{ steps.version.outputs.version }}"
          fail=0
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in CMakeLists.txt ($version)"; fail=1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"; fail=1
          fi
          for adr in docs/decisions/0002-licencja-juce.md docs/decisions/0016-identyfikatory-nazwy.md; do
            if grep -q 'Status:\*\* \*\*Otwarta' "$adr"; then
              echo "::error::$adr is still open: decide it before publishing binaries"; fail=1
            fi
          done
          if grep -q '^PROVISIONAL' packaging/LICENSE.txt; then
            echo "::error::packaging/LICENSE.txt is provisional (ADR-0002)"; fail=1
          fi
          exit $fail

  macos:
    name: macOS installer (universal)
    needs: check
    runs-on: macos-14
    timeout-minutes: 120
    env:
      SIGNING: ${{ secrets.MACOS_CERTIFICATES_P12 != '' }}
      AU: ${{ vars.SSC_FORMAT_AU == 'ON' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: brew install ninja || true
      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSSC_WARNINGS_AS_ERRORS=ON -DSSC_FORMAT_AU=$AU \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: |
          ulimit -s 1024
          ctest --test-dir build -C Release --output-on-failure
      - name: pluginval (strictness 10)
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          7z x -y pluginval.zip > /dev/null
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --output-dir pluginval-report \
            "$ARTEFACTS/VST3/Sam Spectral Control.vst3"
      - name: VST3 validator
        run: bash tools/ci/vst3-validator.sh "$ARTEFACTS/VST3/Sam Spectral Control.vst3"
      - name: auval
        if: env.AU == 'ON'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ARTEFACTS/AU/Sam Spectral Control.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -strict -v aufx Sspc SamA
      - name: Import the signing certificates
        if: env.SIGNING == 'true'
        env:
          MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" -P "$MACOS_CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          rm "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identities="$(security find-identity -v "$keychain")"
          {
            echo "MACOS_KEYCHAIN=$keychain"
            echo "MACOS_APP_IDENTITY=$(sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' <<< "$identities" | head -n 1)"
            echo "MACOS_INSTALLER_IDENTITY=$(sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' <<< "$identities" | head -n 1)"
          } >> "$GITHUB_ENV"
      - name: Installer
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -n "$NOTARY_KEY_P8" ]]; then
            printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            export NOTARY_KEY_FILE="$RUNNER_TEMP/notary.p8"
          fi
          packaging/macos/build-pkg.sh "$ARTEFACTS" "${{ needs.check.outputs.version }}" dist
      - name: Remove the signing keychain
        if: always() && env.SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macOS
          path: dist/*.pkg
          if-no-files-found: error

  windows:
    name: Windows installer (x64)
    needs: check
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        shell: bash
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DSSC_WARNINGS_AS_ERRORS=ON
      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4
      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure
      - name: pluginval (strictness 10)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Windows.zip"
          7z x -y pluginval.zip > /dev/null
          ./pluginval.exe --strictness-level 10 --validate-in-process --output-dir pluginval-report "$ARTEFACTS/VST3/Sam Spectral Control.vst3"
      - name: VST3 validator
        shell: bash
        run: bash tools/ci/vst3-validator.sh "$ARTEFACTS/VST3/Sam Spectral Control.vst3"
      - name: Sign the plug-in
        if: env.SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\build\src\SamSpectralControl_artefacts\Release\VST3\Sam Spectral Control.vst3\Contents\x86_64-win
          files-folder-filter: vst3
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=${{ needs.check.outputs.version }}" "/DArtefacts=$env:GITHUB_WORKSPACE\build\src\SamSpectralControl_artefacts\Release" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" packaging\windows\SamSpectralControl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign the installer
        if: env.SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: installer-Windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: [ check, macos, windows ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes and checksums
        run: |
          version="${{ needs.check.outputs.version }}"
          awk -v v="$version" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > release-notes.md
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat release-notes.md dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Sam Spectral Control ${{ needs.check.outputs.version }}
          body_path: release-notes.md
          files: dist/*
