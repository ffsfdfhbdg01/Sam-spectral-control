name: CI

# GitHub Actions minutes are limited (private repository: macOS minutes count x10, Windows x2), so
# CI does not run on pushes to working branches. It runs for pull requests, for pushes to
# main/master and by hand (Actions -> CI -> Run workflow), where "platforms: linux" leaves out
# macOS and Windows. Changes to documentation alone do not start it. Every check also runs
# locally: docs/testing.md, docs/release.md.

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    paths-ignore: [ '**.md', 'docs/**' ]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'all = Linux, macOS and Windows; linux = only the Linux jobs (cheapest)'
        type: choice
        options: [ all, linux ]
        default: all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4
  ARTEFACTS: build/src/SamSpectralControl_artefacts/Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'linux' && '[{"name":"Linux","os":"ubuntu-24.04"}]' || '[{"name":"Linux","os":"ubuntu-24.04"},{"name":"macOS (universal)","os":"macos-14"},{"name":"Windows x64","os":"windows-2022"}]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libglu1-mesa-dev mesa-common-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Configure
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSSC_WARNINGS_AS_ERRORS=ON ;;
            macOS) cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSSC_WARNINGS_AS_ERRORS=ON \
                     "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 ;;
            Windows) cmake -B build -G "Visual Studio 17 2022" -A x64 -DSSC_WARNINGS_AS_ERRORS=ON ;;
          esac

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Test
        shell: bash
        # Linux and macOS run the tests with a 1 MB stack, the Windows default, to catch large stack frames early.
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then ulimit -s 1024; fi
          ctest --test-dir build -C Release --output-on-failure

      - name: Download pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_${RUNNER_OS}.zip"
          7z x -y pluginval.zip > /dev/null

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) pluginval=(xvfb-run -a ./pluginval) ;;
            macOS) pluginval=(./pluginval.app/Contents/MacOS/pluginval) ;;
            Windows) pluginval=(./pluginval.exe) ;;
          esac
          "${pluginval[@]}" --strictness-level 10 --validate-in-process --output-dir pluginval-report \
            "$ARTEFACTS/VST3/Sam Spectral Control.vst3"

      - name: VST3 validator (Steinberg, extensive)
        shell: bash
        run: bash tools/ci/vst3-validator.sh "$ARTEFACTS/VST3/Sam Spectral Control.vst3"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SamSpectralControl-VST3-${{ runner.os }}
          path: ${{ env.ARTEFACTS }}/VST3
          if-no-files-found: error

      - name: Upload pluginval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-report-${{ runner.os }}
          path: pluginval-report
          if-no-files-found: ignore

  sanitizers:
    name: DSP core — ASan/UBSan (Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure
        run: CC=clang CXX=clang++ cmake --preset sanitize -DSSC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset sanitize --parallel 4
      - name: Test
        run: ctest --preset sanitize

  realtime:
    name: Real-time safety — RealtimeSanitizer (Clang 20)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-20 libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libglu1-mesa-dev mesa-common-dev
      - name: Configure
        run: CC=clang-20 CXX=clang++-20 cmake --preset rtsan -DSSC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset rtsan --parallel 4
      - name: Test
        # Engine::process and the audio callback are checked for allocations, locks and blocking calls.
        run: |
          ulimit -s 1024
          ctest --preset rtsan

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: git ls-files 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h' 'tools/*.cpp' | xargs clang-format-18 --style=file --dry-run --Werror
