name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            configure: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSSC_WARNINGS_AS_ERRORS=ON
            build-dir: build/src/SamSpectralControl_artefacts/Release
            pluginval: xvfb-run -a ./pluginval
          - name: macOS (universal)
            os: macos-14
            configure: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSSC_WARNINGS_AS_ERRORS=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            build-dir: build/src/SamSpectralControl_artefacts/Release
            pluginval: ./pluginval.app/Contents/MacOS/pluginval
          - name: Windows x64
            os: windows-2022
            configure: cmake -B build -G "Visual Studio 17 2022" -A x64 -DSSC_WARNINGS_AS_ERRORS=ON
            build-dir: build/src/SamSpectralControl_artefacts/Release
            pluginval: ./pluginval.exe

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libglu1-mesa-dev mesa-common-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Configure
        shell: bash
        run: ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Test
        shell: bash
        # Linux and macOS run the tests with a 1 MB stack, the Windows default, to catch large stack frames early.
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then ulimit -s 1024; fi
          ctest --test-dir build -C Release --output-on-failure

      - name: Download pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_${{ runner.os }}.zip"
          7z x -y pluginval.zip > /dev/null

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          ${{ matrix.pluginval }} --strictness-level 10 --validate-in-process --output-dir pluginval-report \
            "${{ matrix.build-dir }}/VST3/Sam Spectral Control.vst3"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SamSpectralControl-VST3-${{ runner.os }}
          path: ${{ matrix.build-dir }}/VST3
          if-no-files-found: error

      - name: Upload pluginval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-report-${{ runner.os }}
          path: pluginval-report
          if-no-files-found: ignore

  sanitizers:
    name: DSP core — ASan/UBSan (Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure
        run: CC=clang CXX=clang++ cmake --preset sanitize -DSSC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset sanitize --parallel 4
      - name: Test
        run: ctest --preset sanitize

  realtime:
    name: Real-time safety — RealtimeSanitizer (Clang 20)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-20 libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libglu1-mesa-dev mesa-common-dev
      - name: Configure
        run: CC=clang-20 CXX=clang++-20 cmake --preset rtsan -DSSC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset rtsan --parallel 4
      - name: Test
        # Engine::process and the audio callback are checked for allocations, locks and blocking calls.
        run: |
          ulimit -s 1024
          ctest --preset rtsan

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: git ls-files 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h' 'tools/*.cpp' | xargs clang-format-18 --style=file --dry-run --Werror
